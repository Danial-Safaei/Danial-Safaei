    <rect x="164" y="252" width="96" height="21" rx="5" fill="#241a3d" stroke="#3d2f66"/>
    <text x="212" y="266.5" text-anchor="middle" fill="#c1a4ff">FIRST AUTHOR</text>

    <rect x="268" y="252" width="92" height="21" rx="5" fill="#10302d" stroke="#1d5450"/>

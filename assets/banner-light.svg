<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-label="Danial Safaei, PhD researcher at WMG University of Warwick, Safe AI for autonomous systems. Diagram: a real camera frame and its simulator twin are given to the same frozen system under test, which produces the same output while relying on different visual evidence.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0f766e" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="290" rx="10" fill="url(#bg)"/>
  <ellipse cx="150" cy="30" rx="320" ry="170" fill="url(#glowA)"/>
  <ellipse cx="880" cy="270" rx="300" ry="160" fill="url(#glowB)"/>
  <rect x="0.5" y="0.5" width="999" height="289" rx="10" fill="none" stroke="#d8dee6"/>

  <text x="52" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" letter-spacing="2.6" fill="#2563eb">PhD RESEARCHER · WMG · UNIVERSITY OF WARWICK</text>

  <text x="50" y="126" font-family="Georgia,'Times New Roman',serif" font-size="43" font-weight="700" fill="#111318" letter-spacing="-0.8">Danial Safaei</text>

  <text x="52" y="163" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="16.5" fill="#45464a">Safe AI for autonomous systems</text>

  <rect x="52" y="181" width="118" height="2.5" rx="1.25" fill="url(#accent)"/>

  <text x="52" y="216" font-family="Georgia,'Times New Roman',serif" font-size="15" font-style="italic" fill="#6c6e73">Fidelity is not how real it looks.</text>
  <text x="52" y="238" font-family="Georgia,'Times New Roman',serif" font-size="15" font-style="italic" fill="#2b2d33">It is whether the model decides for the same reason.</text>

